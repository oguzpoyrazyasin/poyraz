name: Web CI

on:
  push:
    branches: [ "master" ]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package.json
      - run: npm install
      - run: npm run build
