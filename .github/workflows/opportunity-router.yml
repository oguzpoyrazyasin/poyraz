name: Opportunity Router Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - master
    paths:
      - "opportunity-router-agent/**"
      - ".github/workflows/opportunity-router.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: opportunity-router-agent
  cancel-in-progress: true

jobs:
  discover-verify-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate agents
        working-directory: opportunity-router-agent
        run: |
          python -m py_compile agent.py verifier.py solution_preparer.py
          python test_agent.py

      - name: Discover verify and prepare
        working-directory: opportunity-router-agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAX_RESULTS: "25"
          MAX_VERIFY: "20"
          PUBLISH_ISSUE: "true"
        run: python agent.py

      - name: Upload ranked and prepared reports
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-router-report
          path: opportunity-router-agent/output/
          if-no-files-found: error
          retention-days: 14
